<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#13264A"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<title>Gilbeot Transit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=IBM+Plex+Sans+KR:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --paper:#EEF2F6; --surface:#FFFFFF; --surface2:#F6F8FB; --ink:#0F1B2D; --muted:#566377; --line:#D6DDE7;
  --navy:#13264A; --navy-ink:#FFFFFF; --exit:#FFD200; --exit-ink:#111111;
  --accent:#0079B8; --accent-soft:#E0F1FA; --ok:#1E8E5A; --warn:#B35A00;
  --ui:"Noto Sans",system-ui,-apple-system,"Segoe UI","Hiragino Sans","PingFang SC","Microsoft YaHei",sans-serif;
  --ko:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",var(--ui);
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark; --paper:#0A111D; --surface:#121B2B; --surface2:#172236; --ink:#E7EDF6; --muted:#98A5B8; --line:#26324A;
  --navy:#0B1830; --navy-ink:#F2F5FA; --accent:#46B4EC; --accent-soft:#12324A; --ok:#4CC38A; --warn:#F0A04B;}}
:root[data-theme="dark"]{
  color-scheme:dark; --paper:#0A111D; --surface:#121B2B; --surface2:#172236; --ink:#E7EDF6; --muted:#98A5B8; --line:#26324A;
  --navy:#0B1830; --navy-ink:#F2F5FA; --accent:#46B4EC; --accent-soft:#12324A; --ok:#4CC38A; --warn:#F0A04B;}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ko{font-family:var(--ko)}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:var(--navy-ink);padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:baseline;gap:8px;flex:1;min-width:0}
.brand b{font-weight:800;font-size:18px;letter-spacing:.01em}
.brand span{font-family:var(--ko);font-size:13px;opacity:.7}
.langbtn{border:1px solid rgba(255,255,255,.35);background:transparent;color:var(--navy-ink);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center}
main{flex:1;padding:16px 16px 96px;display:flex;flex-direction:column;gap:16px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);font-weight:600;line-height:1.15;text-align:center}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:22px;font-weight:800}
h2{font-size:17px;font-weight:700}
h3{font-size:15px;font-weight:700}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:8px;font-weight:600;font-size:13px;line-height:1.3}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12);color:var(--accent)}
.dests{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dest{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.dest b{font-size:15px}
.dest .ko{font-size:13px;color:var(--muted)}
.dest[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=search],textarea{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:15px}
textarea{font:inherit;color:inherit;min-height:64px;resize:vertical}
.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:700;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-size:14px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.sm{padding:7px 11px;font-size:13px}
.summary{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;background:var(--surface2);border:1px solid var(--line)}
.lbadge{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 7px;border-radius:999px;color:#fff;font-family:var(--mono);font-weight:600;font-size:12px;flex:none}
.exitbadge{display:inline-flex;align-items:center;gap:4px;background:var(--exit);color:var(--exit-ink);border-radius:6px;padding:2px 8px;font-weight:800;font-family:var(--mono);font-size:13px}
/* steps */
.steps{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:36px 1fr;gap:12px;position:relative;padding-bottom:18px}
.step:last-child{padding-bottom:0}
.step::before{content:"";position:absolute;left:17px;top:36px;bottom:0;width:2px;background:var(--stepc,var(--line))}
.step:last-child::before{display:none}
.snum{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-family:var(--mono);background:var(--surface);border:2px solid var(--stepc,var(--line));color:var(--ink);font-size:14px}
.step.done .snum{background:var(--ok);border-color:var(--ok);color:#fff}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.step.done .scard{opacity:.62}
.stitle{font-weight:700;font-size:15px}
.sign{display:flex;align-items:center;gap:10px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);padding:8px 10px}
.sign .ko{font-weight:700;font-size:16px}
.sign .tr{font-size:12px;color:var(--muted)}
.sacts{display:flex;gap:8px;flex-wrap:wrap}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;font-size:13px;padding:2px 0}
/* station board */
.board{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.board .band{height:8px}
.board .bd{padding:10px 14px;display:flex;align-items:center;gap:12px}
.board .nm > .ko{font-size:22px;font-weight:700;line-height:1.2}
.board .nm .tr{font-size:14px;color:var(--muted)}
/* line map */
.linetabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.linetabs button{flex:none;border:2px solid var(--lc);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;display:flex;gap:6px;align-items:center}
.linetabs button[aria-pressed="true"]{background:var(--lc);color:#fff}
.stlist{display:flex;flex-direction:column}
.st{display:grid;grid-template-columns:52px 22px 1fr;align-items:center;gap:10px;min-height:52px}
.st .code{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
.st .dot{position:relative;height:100%;display:grid;place-items:center}
.st .dot::before{content:"";position:absolute;top:0;bottom:0;width:6px;background:var(--lc)}
.st:first-child .dot::before{top:50%}.st:last-child .dot::before{bottom:50%}
.st .dot i{position:relative;width:16px;height:16px;border-radius:50%;background:var(--surface);border:4px solid var(--lc)}
.st.xfer .dot i{width:20px;height:20px;border-width:3px;border-color:var(--ink);background:var(--surface)}
.st .nm{display:flex;flex-direction:column;padding-block:6px}
.st .nm .ko{font-weight:700;font-size:15px}
.st .nm .tr{font-size:13px;color:var(--muted)}
.st .xl{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.xl .lbadge{height:18px;min-width:18px;font-size:10px;padding:0 5px}
/* korean card */
.kcard{background:#FFFDF2;color:#111;border:2px solid #111;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:10px}
.kcard .big{font-family:var(--ko);font-size:30px;font-weight:700;line-height:1.25;word-break:keep-all}
.kcard .addr{font-family:var(--ko);font-size:19px;font-weight:600;word-break:keep-all}
.kcard .say{font-family:var(--ko);font-size:18px;border-top:1px dashed #999;padding-top:10px}
.kcard .tr{font-size:13px;color:#555}
.phr{display:grid;gap:8px}
.phr button{text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.phr button .ko{font-weight:700;font-size:16px}
.phr button span.tr{font-size:13px;color:var(--muted)}
/* map */
.mapbox{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface2)}
.mapbox svg{display:block;width:100%;height:auto}
.results{display:flex;flex-direction:column;gap:6px}
.res{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);text-align:left;width:100%}
.res .ko{font-size:13px;color:var(--muted)}
.list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.buscolors{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bc{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface2)}
.bc i{width:28px;height:18px;border-radius:4px;flex:none}
.note{font-size:12px;color:var(--muted);border-left:3px solid var(--warn);padding-left:10px}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(5,10,20,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.langs{display:grid;gap:8px}
.langs button{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:12px 14px;font-size:16px;font-weight:600}
.langs button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;z-index:60}
.preview{max-height:220px;border-radius:10px;object-fit:contain;background:#000;width:100%}
details.guide summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.guide summary::after{content:"+";font-size:20px;color:var(--muted)}
details.guide[open] summary::after{content:"–"}
@media (prefers-reduced-motion:no-preference){.step,.panel{animation:rise .25s ease both}@keyframes rise{from{transform:translateY(4px)}to{transform:none}}}
@media (max-width:380px){.dests{grid-template-columns:1fr}.buscolors{grid-template-columns:1fr}}
</style>
</head><body>
<div class="app">
  <header class="top">
    <div class="brand"><b>Gilbeot</b><span>길벗</span></div>
    <button class="langbtn" id="langbtn" aria-label="Language"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span id="langLabel">English</span></button>

  <div style="background:var(--navy);color:var(--navy-ink);padding:0 16px 12px;font-size:13px;opacity:.85" id="tagline"></div>

  <nav class="tabs"><div class="in" id="nav"></div></nav>
</div>

  firstTime:{en:"First time on Korean transit?",ja:"韓国の交通は初めてですか？",zh:"第一次在韩国乘坐公共交通？",vi:"Lần đầu đi giao thông công cộng ở Hàn?",ru:"Впервые в транспорте Кореи?"},
  tmoneyTitle:{en:"How to use a T-money card",ja:"T-moneyカードの使い方",zh:"T-money交通卡使用方法",vi:"Cách dùng thẻ T-money",ru:"Как пользоваться картой T-money"},

  youHere:{en:"You",ja:"現在地",zh:"我的位置",vi:"Bạn",ru:"Вы"},

  metroNote:{en:"Showing the lines used by the airport routes in this app. The round black ring marks a transfer station.",ja:"このアプリの空港ルートで使う路線を表示しています。黒い丸は乗換駅です。",zh:"显示本应用机场路线使用的线路。黑色圆圈表示换乘站。",vi:"Hiển thị các tuyến dùng trong lộ trình sân bay. Vòng tròn đen là ga chuyển tuyến.",ru:"Показаны линии, используемые в маршрутах из аэропорта. Чёрное кольцо — пересадочная станция."},
  xferTo:{en:"Transfer",ja:"乗換",zh:"换乘",vi:"Chuyển",ru:"Пересадка"},

// ===== State =====
const store = {
  get(k,d){try{const v=localStorage.getItem("gilbeot."+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem("gilbeot."+k,JSON.stringify(v))}catch(e){}}
};
function detectLang(){
  const n=((navigator.languages&&navigator.languages[0])||navigator.language||"en").toLowerCase();
  for(const l of ["ja","zh","vi","ru"]) if(n.startsWith(l)) return l;
  return "en";
}
const state = {
  lang: store.get("lang", null),
  tab: store.get("tab","route"),
  term: store.get("term","T1"),
  dest: store.get("dest","hongdae"),
  mode: store.get("mode","train"),
  done: store.get("done",[]),
  hotel: store.get("hotel",{name:"",addr:""}),
  phrase: store.get("phrase",0),
  q:"", signQ:"", loc:null, locMsg:"", ocr:null
};
const firstRun = !state.lang;
if(!state.lang) state.lang = detectLang();
const L = ()=>state.lang;
const t = k => (T[k]&&(T[k][L()]||T[k].en))||k;
const tr = o => o? (o[L()]||o.en) : "";
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const stN = id => ST[id][L()]||ST[id].en;
const place = id => PLACES.find(p=>p.id===id);
const save = ()=>{["lang","tab","term","dest","mode","done","hotel","phrase"].forEach(k=>store.set(k,state[k]))};
const lb = (key,small)=>{const l=LINES[key];return `<span class="lbadge" style="background:${l.c}" title="${esc(tr(l.n))}">${esc(l.s)}</span>`};

// ===== Route builder =====
function buildRoute(){
  const T1 = state.term==="T1", from = T1?"t1":"t2", d = state.dest, steps=[];
  const P = place(d);
  const push=(kind,text,extra={})=>steps.push(Object.assign({kind,text},extra));
  const sText = (k,p)=>S[k][L()](p||{});
  if(state.mode==="bus"){
    if(d!=="myeongdong") return null;
    push("card",sText("buy"),{sign:{ko:"편의점 · 티머니",tr:"T-money"}});
    push("bus",sText("busFind",{t:state.term}),{c:"#1F3F7A",sign:{ko:"6015 명동 · 을지로",tr:"Bus 6015"}});
    push("bus",sText("busPay"),{c:"#1F3F7A",sign:{ko:"승차권 매표소",tr:tr({en:"Ticket counter",ja:"乗車券売り場",zh:"售票处",vi:"Quầy vé",ru:"Касса"})}});
    push("bus",sText("busRide"),{c:"#1F3F7A",sign:{ko:"서울 시내 방면",tr:tr({en:"Toward central Seoul",ja:"ソウル市内方面",zh:"首尔市区方向",vi:"Hướng trung tâm Seoul",ru:"В центр Сеула"})}});
    push("bus",sText("busOff"),{c:"#1F3F7A",sign:{ko:"명동역",tr:stN("myeongdong")}});
    push("arrive",sText("arrive",{place:tr(P)}));
    return {steps,min:T1?80:95,xfer:0,fare:"₩17,000",bus:true};
  }
  const arex = "#0090D2", l2="#00A84D", l4="#00A5DE";
  push("card",sText("buy"),{sign:{ko:"편의점 · 티머니",tr:"T-money"}});
  push("walk",sText("toArex"),{c:arex,sign:{ko:"공항철도",tr:tr(LINES.AREX.n)}});
  push("train",sText("board"),{c:arex,line:"AREX",sign:{ko:"일반열차 · 서울역 방면",tr:tr({en:"All-stop train · toward Seoul Station",ja:"一般列車・ソウル駅方面",zh:"普通列车 · 首尔站方向",vi:"Tàu thường · hướng Ga Seoul",ru:"Обычный поезд · до вокзала Сеул"})}});
  const extra = T1?0:1, addMin = T1?0:7;
  let min=0, xfer=0;
  if(d==="hongdae"||d==="gangnam"){
    min = 52+addMin;
    push("train",sText("ride",{n:10+extra,m:min,st:stN("hongik")}),{c:arex,line:"AREX",sign:{ko:"홍대입구",tr:stN("hongik")},station:"hongik"});
    if(d==="hongdae"){
      const E=PLACE_EXIT.hongdae;
      push("exit",sText("exit",{n:E.n,place:tr(E.place)}),{exit:E.n,sign:{ko:`${E.n}번 출구`,tr:tr(E.place)}});
    } else {
      xfer=1;
      push("walk",sText("xfer",{line:tr(LINES.L2.n),next:stN("hapjeong")}),{c:l2,line:"L2",sign:{ko:"2호선 · 합정 방면",tr:`${tr(LINES.L2.n)} · ${stN("hapjeong")}`}});
      push("train",sText("ride",{n:17,m:36,st:stN("gangnam")}),{c:l2,line:"L2",sign:{ko:"강남",tr:stN("gangnam")},station:"gangnam"});
      min += 8+36;
      const E=PLACE_EXIT.gangnam;
      push("exit",sText("exit",{n:E.n,place:tr(E.place)}),{exit:E.n,sign:{ko:`${E.n}번 출구`,tr:tr(E.place)}});
    }
  } else {
    min = 59+addMin;
    push("train",sText("ride",{n:12+extra,m:min,st:stN("seoul")}),{c:arex,line:"AREX",sign:{ko:"서울역",tr:stN("seoul")},station:"seoul"});
    if(d==="myeongdong"){
      xfer=1;
      push("walk",sText("xfer",{line:tr(LINES.L4.n),next:stN("hoehyeon")}),{c:l4,line:"L4",sign:{ko:"4호선 · 회현 방면",tr:`${tr(LINES.L4.n)} · ${stN("hoehyeon")}`}});
      push("train",sText("ride",{n:2,m:4,st:stN("myeongdong")}),{c:l4,line:"L4",sign:{ko:"명동",tr:stN("myeongdong")},station:"myeongdong"});
      min += 10+4;
      const E=PLACE_EXIT.myeongdong;
      push("exit",sText("exit",{n:E.n,place:tr(E.place)}),{exit:E.n,sign:{ko:`${E.n}번 출구`,tr:tr(E.place)}});
    }
  }
  push("arrive",sText("arrive",{place:tr(P)}));
  return {steps,min,xfer};
}
function routeStations(){
  const T1=state.term==="T1", ids=new Set([T1?"t1":"t2"]);
  const add=(line,a,b)=>{const o=LINE_ORDER[line].map(x=>x[0]);let i=o.indexOf(a),j=o.indexOf(b);if(i>j)[i,j]=[j,i];o.slice(i,j+1).forEach(x=>ids.add(x))};
  if(state.mode==="bus"){ids.add("myeongdong");return ids;}
  const d=state.dest;
  if(d==="hongdae"||d==="gangnam") add("AREX",T1?"t1":"t2","hongik"); else add("AREX",T1?"t1":"t2","seoul");
  if(d==="gangnam") add("L2","hongik","gangnam");
  if(d==="myeongdong") add("L4","seoul","myeongdong");
  return ids;
}

function drawMap(){
  const svg=$("#mapsvg"); if(!svg) return;
  const cs=getComputedStyle(document.documentElement);
  const ink=cs.getPropertyValue("--ink").trim(), muted=cs.getPropertyValue("--muted").trim(), surf=cs.getPropertyValue("--surface").trim(), acc=cs.getPropertyValue("--accent").trim();
  const poly=(ids,c,w)=>`<polyline fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" points="${ids.map(id=>px(...SC[id]).join(",")).join(" ")}"/>`;
  const river=[[37.585,126.86],[37.56,126.9],[37.545,126.93],[37.53,126.96],[37.515,127.0],[37.52,127.04],[37.53,127.07],[37.525,127.12]].map(p=>px(p[0],p[1]).join(",")).join(" ");
  let g=`<rect width="${MAPW}" height="${MAPH}" fill="${surf}" opacity=".35"/>`;
  g+=`<polyline fill="none" stroke="#8EC5E6" stroke-opacity=".55" stroke-width="12" stroke-linecap="round" points="${river}"/>`;
  g+=`<text x="${px(37.522,127.05)[0]}" y="${px(37.522,127.05)[1]+22}" font-size="10" fill="${muted}" font-family="IBM Plex Sans KR,sans-serif">한강 Han River</text>`;
  const [ax,ay]=px(...SC.dmc);
  g+=`<polyline fill="none" stroke="#0090D2" stroke-width="4" stroke-linecap="round" points="0,${ay+18} ${ax},${ay} ${px(...SC.hongik).join(",")} ${px(...SC.gongdeok).join(",")} ${px(...SC.seoul).join(",")}"/>`;
  g+=poly(["hongik","hapjeong","dangsan","sindorim","daerim","sillim","sadang","gyodae","gangnam"],"#00A84D",4);
  g+=poly(["seoul","hoehyeon","myeongdong","chungmuro","ddp"],"#00A5DE",4);
  g+=`<text x="6" y="${MAPH-8}" font-size="10" fill="${muted}">← AREX · ${esc(stN("t1"))} ~50km</text>`;
  const route=routeStations();
  Object.keys(SC).forEach(id=>{const [x,y]=px(...SC[id]);const on=route.has(id);
    g+=`<circle cx="${x}" cy="${y}" r="${on?5:3.5}" fill="${surf}" stroke="${on?ink:muted}" stroke-width="${on?2.5:1.5}"/>`;
    if(["seoul","hongik","gangnam","myeongdong","sindorim","sadang"].includes(id)) g+=`<text x="${x+7}" y="${y-6}" font-size="10.5" font-weight="700" fill="${ink}">${esc(stN(id).replace(/（.*?）|\(.*?\)/g,""))}</text>`;
  });
  PLACES.filter(p=>!p.route&&p.lat<BOUNDS.n&&p.lat>BOUNDS.s&&p.lng>BOUNDS.w&&p.lng<BOUNDS.e).forEach(p=>{const [x,y]=px(p.lat,p.lng);
    g+=`<g data-pick="${p.id}" style="cursor:pointer"><rect x="${x-4}" y="${y-4}" width="8" height="8" transform="rotate(45 ${x} ${y})" fill="${p.id===state.dest?acc:muted}"/></g>`;});
  const P=place(state.dest);
  if(P&&P.lat<BOUNDS.n&&P.lat>BOUNDS.s){const [x,y]=px(P.lat,P.lng);
    g+=`<g><path d="M${x} ${y} l-8 -16 a9 9 0 1 1 16 0 z" fill="${acc}" stroke="${surf}" stroke-width="1.5"/><circle cx="${x}" cy="${y-19}" r="3.2" fill="${surf}"/></g>`;
    const lbl=tr(P); const tx=Math.min(x+10,MAPW-8-lbl.length*6.2);
    g+=`<text x="${tx}" y="${y+14}" font-size="11.5" font-weight="800" fill="${acc}">${esc(lbl)}</text>`;}
  if(state.loc){const {lat,lng}=state.loc;
    if(lat<BOUNDS.n&&lat>BOUNDS.s&&lng>BOUNDS.w&&lng<BOUNDS.e){const [x,y]=px(lat,lng);
      g+=`<circle cx="${x}" cy="${y}" r="11" fill="#2F80ED" opacity=".2"/><circle cx="${x}" cy="${y}" r="5.5" fill="#2F80ED" stroke="#fff" stroke-width="2"/><text x="${x+9}" y="${y+4}" font-size="11" font-weight="700" fill="#2F80ED">${esc(t("youHere"))}</text>`;}}
  svg.innerHTML=g;
}
function locate(){
  const done=m=>{state.locMsg=m;const el=$("#locmsg");if(el)el.textContent=m;};
  if(!navigator.geolocation){done(t("locOff"));return;}
  navigator.geolocation.getCurrentPosition(pos=>{
    state.loc={lat:pos.coords.latitude,lng:pos.coords.longitude};
    let best=null,bd=1e9;PLACES.forEach(p=>{const d=Math.hypot(p.lat-state.loc.lat,(p.lng-state.loc.lng)*0.79);if(d<bd){bd=d;best=p}});
    done(`${t("nearest")}: ${tr(best)} (~${Math.max(0.1,bd*111).toFixed(1)} km)`);drawMap();
  },()=>done(t("locOff")),{timeout:8000,maximumAge:60000});
}

// ----- Sign scan -----
function signMatches(q){
  q=(q||"").trim().toLowerCase().replace(/\s+/g,""); if(!q) return [];
  return Object.keys(ST).filter(id=>{const s=ST[id];return [s.ko,s.en,s.ja,s.zh,s.vi,s.ru].some(v=>v.toLowerCase().replace(/\s+/g,"").includes(q))||q.includes(s.ko)});
}
function liveMatchHTML(q){
  q=(q||"").trim().toLowerCase().replace(/\s+/g,""); if(!q) return "";
  const m=liveRouteNames(); const out=[];
  m.forEach((loc,ko)=>{if(Object.values(ST).some(s=>s.ko===ko))return;const k2=ko.replace(/\s+/g,"");if(k2.includes(q)||q.includes(k2)||(loc||"").toLowerCase().replace(/\s+/g,"").includes(q))out.push([ko,loc])});
  return out.slice(0,6).map(([ko,loc])=>`<div class="board"><div class="band" style="background:var(--ok)"></div><div class="bd"><div class="nm" style="flex:1"><div class="ko">${esc(ko)}</div><div class="tr">${esc(loc||romanize(ko))}</div><div class="small" style="color:var(--ok);font-weight:700">✓ ${esc(t("onRoute"))}</div></div></div></div>`).join("");
}
function boardHTML(id){
  const s=ST[id],route=routeStations(),on=route.has(id);
  return `<div class="board"><div class="band" style="background:${LINES[s.x[0]].c}"></div><div class="bd">
    <div class="row" style="flex-direction:column;gap:4px">${s.x.map(x=>lb(x)).join("")}</div>
    <div class="nm" style="flex:1"><div class="ko">${esc(s.ko)}</div><div class="tr">${esc(s[L()]||s.en)}</div>
    <div class="small" style="color:${on?"var(--ok)":"var(--muted)"};font-weight:700">${on?"✓ "+esc(t("onRoute")):esc(t("notRoute"))}</div></div></div></div>`;
}
function vScan(){
  const o=state.ocr;
  const ms=signMatches(state.signQ);
  return `<section class="panel"><h1>${esc(t("scanTitle"))}</h1><p class="muted">${esc(t("scanDesc"))}</p>
    <label class="btn" for="photo">📷 ${esc(t("takePhoto"))}</label>
    <input id="photo" type="file" accept="image/*" capture="environment" hidden>
    ${o&&o.img?`<img class="preview" src="${o.img}" alt="">`:""}
    ${o?`<div id="ocrout">${ocrHTML()}</div>`:""}
  </section>
  <section class="panel"><div class="field"><label for="signq">${esc(t("typeSign"))}</label>
    <input type="search" id="signq" value="${esc(state.signQ)}" placeholder="명동 / Myeongdong" autocomplete="off"></div>
    <div id="signres" class="results">${ms.map(boardHTML).join("")}${liveMatchHTML(state.signQ)}</div>
    <div class="row">${[...new Set([...routeStations(),"seoul","hongik","myeongdong","gangnam"])].map(id=>`<button class="chip" data-sq="${esc(ST[id].ko)}">${esc(ST[id].ko)}</button>`).join("")}</div>
  </section>`;
}
function ocrHTML(){
  const o=state.ocr; if(!o) return "";
  if(o.status==="busy") return `<p class="muted">${esc(t("reading"))}</p>`;
  if(o.status==="off") return `<p class="note">${esc(t("ocrOff"))}</p>`;
  const lv=(o.live||[]).map(k=>liveMatchHTML(k)).join("");
  if(!o.ids.length&&!lv) return `<p class="note">${esc(t("noMatch"))}</p>`;
  return `<div class="eyebrow">${esc(t("found"))}</div><div class="results">${o.ids.map(boardHTML).join("")}${lv}</div>`;
}
let tessLoading=null;
function loadTess(){
  if(window.Tesseract) return Promise.resolve();
  if(tessLoading) return tessLoading;
  tessLoading=new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";s.onload=ok;s.onerror=no;document.head.appendChild(s)});
  return tessLoading;
}
async function runOCR(file){
  const img=URL.createObjectURL(file);
  state.ocr={status:"busy",img,ids:[]};render();
  const upd=()=>{const el=$("#ocrout");if(el)el.innerHTML=ocrHTML();};
  try{
    await loadTess();
    const job=window.Tesseract.recognize(file,"kor");
    const r=await Promise.race([job,new Promise((_,no)=>setTimeout(()=>no("timeout"),45000))]);
    const text=(r.data.text||"").replace(/\s+/g,"");
    const ids=Object.keys(ST).filter(id=>text.includes(ST[id].ko));
    ids.sort((a,b)=>ST[b].ko.length-ST[a].ko.length);
    state.ocr={status:"ok",img,ids:ids.filter((id,i)=>!ids.slice(0,i).some(o=>ST[o].ko.includes(ST[id].ko))),live:[...liveRouteNames().keys()].filter(k=>k.length>1&&text.includes(k.replace(/\s+/g,"")))};
  }catch(e){state.ocr={status:"off",img,ids:[]};}
  upd();
}

function showBig(ko,sub){
  const d=document.createElement("div");d.className="sheet";d.style.alignItems="center";
  d.innerHTML=`<div class="in" style="border-radius:18px;margin:16px;width:calc(100% - 32px)"><div class="kcard"><div class="big" style="font-size:40px">${esc(ko).replace(/\n/g,"<br>")}</div>${sub?`<div class="tr" style="font-size:15px">${esc(sub)}</div>`:""}</div><button class="btn" data-close>${esc(t("close"))}</button></div>`;
  d.addEventListener("click",e=>{if(e.target===d||e.target.closest("[data-close]"))d.remove()});
  document.body.appendChild(d);
}
function langSheet(first){
  const d=document.createElement("div");d.className="sheet";
  d.innerHTML=`<div class="in"><h2>${esc(t("chooseLang"))}</h2>${first?`<p class="small muted">${esc(t("autoDetected"))}</p>`:""}
    <div class="langs">${LANGS.map(l=>`<button data-lang="${l.id}" aria-pressed="${l.id===L()}"><span>${l.name}</span><span>${l.id===L()?"✓":""}</span></button>`).join("")}</div></div>`;
  d.addEventListener("click",e=>{const b=e.target.closest("[data-lang]");if(b){state.lang=b.dataset.lang;d.remove();render();}else if(e.target===d)d.remove();});
  document.body.appendChild(d);
}
function toast(m){const el=document.createElement("div");el.className="toast";el.textContent=m;document.body.appendChild(el);setTimeout(()=>el.remove(),1600)}
async function copyText(s){
  try{await navigator.clipboard.writeText(s);toast(t("copied"));}
  catch(e){const r=document.createRange();const k=$("#kcard");if(k){r.selectNodeContents(k);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);}}
}

// ===== Events =====
document.addEventListener("click",e=>{
  const b=e.target.closest("button,[data-pick]"); if(!b) return;
  const ds=b.dataset;
  if(ds.tab){state.tab=ds.tab;render();scrollTo(0,0);return;}
  if(ds.term){state.term=ds.term;state.done=[];render();return;}
  if(ds.dest){state.dest=ds.dest;state.done=[];const p=place(ds.dest);state.to={ko:p.ko,addr:p.addr||"",lat:p.lat,lng:p.lng,local:p};state.routes=null;saveLive();render();return;}
  if(ds.mode){state.mode=ds.mode;state.done=[];render();return;}
  if(ds.done!==undefined){const i=+ds.done;state.done=state.done.includes(i)?state.done.filter(x=>x!==i):[...state.done,i];render();return;}
  if("reset" in ds){state.done=[];render();return;}
  if(ds.show){showBig(ds.show,ds.showtr);return;}
  if(ds.pick){const p=place(ds.pick);if(p.route)state.dest=p.id;state.to={ko:p.ko,addr:p.addr||"",lat:p.lat,lng:p.lng,local:p};state.routes=null;saveLive();render();return;}
  if(ds.cardfor){const p=place(ds.cardfor);if(p&&p.route)state.dest=p.id;state.hotel={name:"",addr:""};state.tab="card";render();scrollTo(0,0);return;}
  if(ds.line){metroLine=ds.line;render();return;}
  if("gobus" in ds){state.dest="myeongdong";state.mode="bus";state.done=[];state.tab="route";render();scrollTo(0,0);return;}
  if(ds.sq){state.signQ=ds.sq;render();return;}
  if(ds.phrase!==undefined){state.phrase=+ds.phrase;render();return;}
  if(b.id==="locbtn"){locate();return;}
  if(b.id==="langbtn"){langSheet(false);return;}
  if(b.id==="fullcard"){const c=cardParts();showBig(c.nm+(c.ad?"\n"+c.ad:""),(PHRASES[state.phrase]||PHRASES[0]).ko);return;}
  if(b.id==="copyko"){const c=cardParts();copyText([c.nm,c.ad,(PHRASES[state.phrase]||PHRASES[0]).ko].filter(Boolean).join("\n"));return;}
});

// ---- Korean romanization (Revised Romanization, simplified) ----
const RR_I=["g","kk","n","d","tt","r","m","b","pp","s","ss","","j","jj","ch","k","t","p","h"];
const RR_V=["a","ae","ya","yae","eo","e","yeo","ye","o","wa","wae","oe","yo","u","wo","we","wi","yu","eu","ui","i"];
const RR_F=["","k","k","k","n","n","n","t","l","k","m","l","l","l","p","l","m","p","p","t","t","ng","t","t","k","t","p","t"];
function romanize(s){
  let out="",prevF="";
  for(const ch of String(s)){
    const c=ch.charCodeAt(0);
    if(c>=0xac00&&c<=0xd7a3){
      const n=c-0xac00,i=Math.floor(n/588),v=Math.floor((n%588)/28),f=n%28;
      let ini=RR_I[i];
      if(i===5) ini = prevF==="l"?"l":(prevF?"n":"r");
      if(i===11&&prevF&&prevF!=="ng"){const carry={k:"g",t:"d",p:"b",l:"r",n:"n",m:"m"}[prevF]||"";out=out.slice(0,-prevF.length)+(prevF==="n"||prevF==="m"?prevF:"");ini=carry;}
      out+=ini+RR_V[v]+RR_F[f]; prevF=RR_F[f];
    } else {out+=ch;prevF="";}
  }
  return out.replace(/(^|[\s(·\-\/])([a-z])/g,(m,a,b)=>a+b.toUpperCase());
}

const OD_LANG={en:1,ja:2,zh:3,vi:5,ru:1};
async function odsay(s,e,lang){
  const u=`https://api.odsay.com/v1/api/searchPubTransPathT?SX=${s.lng}&SY=${s.lat}&EX=${e.lng}&EY=${e.lat}&lang=${lang}&apiKey=${encodeURIComponent(state.cfg.odsayKey)}`;

  if(j.error){const er=Array.isArray(j.error)?j.error[0]:j.error;throw Object.assign(new Error(er.msg||er.message||"odsay"),{code:String(er.code)})}
  return j.result;
}
function getFrom(){
  return new Promise((ok,no)=>{
    if(state.from.type!=="loc") return ok(AIRPORT[state.from.type]);
    if(!navigator.geolocation) return no(new Error("noloc"));
    navigator.geolocation.getCurrentPosition(p=>{state.loc={lat:p.coords.latitude,lng:p.coords.longitude};ok({...state.loc,ko:""})},()=>no(new Error("noloc")),{timeout:10000,maximumAge:60000});
  });
}
async function findRoute(){
  if(!state.to){state.err=lt("pickTo");render();return}

  try{

    const [loc,ko]=await Promise.all([odsay(s,state.to,OD_LANG[L()]),odsay(s,state.to,0)]);
    const pl=(loc.path||[]), pk=(ko.path||[]);
    state.routes=pl.slice(0,5).map((p,i)=>({loc:p,ko:(pk[i]&&pk[i].subPath.length===p.subPath.length)?pk[i]:p,start:s}));

function liveSteps(R){
  const steps=[];const sp=R.loc.subPath, kp=R.ko.subPath;
  for(let i=0;i<sp.length;i++){
    const a=sp[i], k=kp[i]||a, nx=sp[i+1], nk=kp[i+1];
    if(a.trafficType===3){
      if(!a.distance) continue;
      const to = nx? (nx.startName) : (state.to? null : "");
      let text=lt("walkTo",{d:a.distance,m:Math.max(1,a.sectionTime),to: nx? `<b>${nx.trafficType===1?esc(nx.startName):esc(nx.startName)}</b>` : `<b>${esc(lt("walkDest"))}</b>`});
      if(nx&&nx.trafficType===1&&nx.startExitNo) text+=lt("enterExit",nx.startExitNo);
      steps.push({html:text,c:"var(--line)",sign:nk?{ko:nk.startName,tr:nx.startName}:null,kind:"walk"});
    } else if(a.trafficType===1){
      const ln=a.lane[0], code=ln.subwayCode, col=SUB_COLOR[code]||"#666";
      let text=lt("subBoard",{st:`<b>${esc(a.startName)}</b>`,line:`<b>${esc(ln.name)}</b>`,way:`<b>${esc(a.way)}</b>`});
      if(a.door&&a.door!=="null") text+=lt("door",esc(a.door));
      steps.push({html:text,c:col,badge:subBadge(code),sign:{ko:`${k.lane[0].name} · ${k.way} 방면`,tr:`${ln.name} · ${a.way}`},live:{t:"sub",st:k.startName,code,way:k.way,key:"s"+i},kind:"train"});
      steps.push({html:lt("subRide",{n:a.stationCount,m:a.sectionTime,st:`<b>${esc(a.endName)}</b>`}),c:col,badge:subBadge(code),sign:{ko:k.endName,tr:a.endName},kind:"train"});
      if(a.endExitNo&&(!nx||nx.trafficType===3)) steps.push({html:lt("exitNo",esc(a.endExitNo)),exit:a.endExitNo,sign:{ko:`${a.endExitNo}번 출구`,tr:"Exit "+a.endExitNo},kind:"exit"});
    } else if(a.trafficType===2){
      const ln=a.lane[0], stops=(a.passStopList&&a.passStopList.stations)||[], kst=(k.passStopList&&k.passStopList.stations)||[];
      const next=stops[1]?stops[1].stationName:a.endName;
      const col=BUS_COLOR[ln.type]||"#3D5BAB";
      steps.push({html:lt("busBoard",{st:esc(a.startName),ars:a.startArsID&&a.startArsID!=="-"?esc(a.startArsID):"",no:`<b>${esc(ln.busNo)}</b>`,next:esc(next)}),c:col,badge:busBadge(ln.busNo,ln.type),
        sign:{ko:`${k.startName} → ${kst[1]?kst[1].stationName:k.endName}`,tr:`${a.startName} → ${next}`},live:a.startArsID&&a.startArsID!=="-"?{t:"bus",ars:a.startArsID,no:ln.busNo,key:"b"+i}:null,kind:"bus"});
      steps.push({html:lt("busRideL",{n:a.stationCount,m:a.sectionTime,st:`<b>${esc(a.endName)}</b>`}),c:col,badge:busBadge(ln.busNo,ln.type),sign:{ko:k.endName,tr:a.endName},kind:"bus"});
    }
  }
  steps.push({html:lt("arriveL",`<b>${nm(state.to.ko)}</b>`),kind:"arrive",sign:{ko:state.to.ko,tr:""}});
  return steps;
}
function routeSummary(p){
  const i=p.info; const parts=p.subPath.filter(s=>s.trafficType!==3).map(s=>s.trafficType===1?subBadge(s.lane[0].subwayCode):busBadge(s.lane[0].busNo,s.lane[0].type));

async function loadLive(L0){
  state.live[L0.key]={loading:true};updLive(L0);
  try{
    if(L0.t==="sub"){
      if(!state.cfg.subway){state.live[L0.key]={off:true};return updLive(L0)}
      const j=await (await fetch(`/api/subway?st=${encodeURIComponent(L0.st)}`)).json();
      const sid=SEOUL_ID[L0.code]||(L0.code<=9?String(1000+ +L0.code):"");
      let items=(j.items||[]).filter(x=>!sid||x.subwayId===sid);
      items.forEach(x=>x.mine=L0.way&&x.dir&&x.dir.includes(L0.way));
      items.sort((a,b)=>(b.mine-a.mine)||(a.sec-b.sec));
      state.live[L0.key]={items:items.slice(0,4),at:Date.now()};
    } else {
      if(!state.cfg.bus){state.live[L0.key]={off:true};return updLive(L0)}
      const j=await (await fetch(`/api/bus?ars=${encodeURIComponent(L0.ars)}&no=${encodeURIComponent(L0.no)}`)).json();
      state.live[L0.key]={bus:(j.matched?j.items:[]),at:Date.now(),area:!j.matched};
    }
  }catch(e){state.live[L0.key]={items:[],err:true}}
  updLive(L0);
}

}

    <div id="lmap" style="height:360px;border-radius:12px;border:1px solid var(--line);overflow:hidden;background:var(--surface2)"></div>
    <div class="row"><button class="btn sm ghost" id="locbtn">📍 ${esc(t("myLoc"))}</button><span class="small muted" id="locmsg">${esc(state.locMsg)}</span></div></section>
    ${to?placePanel(P||{id:"x",ko:to.ko,addr:to.addr,lat:to.lat,lng:to.lng,en:romanize(to.ko)}):vMap()}`;
}
function drawLeaflet(){
  const el=document.getElementById("lmap"); if(!el) return;
  const LF=window.L;
  if(!LF||!LF.map){el.innerHTML=`<p class="small muted" style="padding:12px">${esc(t("mapTip"))}</p>`;return}
  if(lmap){lmap.remove();lmap=null}
  lmap=LF.map(el,{zoomControl:true}).setView([37.5547,126.9707],12);
  LF.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(lmap);
  const pts=[];
  const R=state.routes&&state.routes[state.sel];
  if(R){
    let prev=[R.start.lat,R.start.lng]; pts.push(prev);
    R.loc.subPath.forEach(s=>{
      const st=(s.passStopList&&s.passStopList.stations)||[];
      if(s.trafficType===3) return;
      const col=s.trafficType===1?(SUB_COLOR[s.lane[0].subwayCode]||"#666"):(BUS_COLOR[s.lane[0].type]||"#3D5BAB");
      const line=st.map(x=>[+x.y,+x.x]);
      if(line.length){LF.polyline([prev,line[0]],{color:"#888",weight:3,dashArray:"4 6"}).addTo(lmap);LF.polyline(line,{color:col,weight:6,opacity:.9}).addTo(lmap);
        LF.circleMarker(line[0],{radius:6,color:col,fillColor:"#fff",fillOpacity:1,weight:3}).addTo(lmap).bindTooltip(st[0].stationName);
        LF.circleMarker(line[line.length-1],{radius:6,color:col,fillColor:"#fff",fillOpacity:1,weight:3}).addTo(lmap).bindTooltip(st[st.length-1].stationName);
        prev=line[line.length-1];pts.push(...line);}
    });
    if(state.to){LF.polyline([prev,[state.to.lat,state.to.lng]],{color:"#888",weight:3,dashArray:"4 6"}).addTo(lmap)}
    LF.circleMarker([R.start.lat,R.start.lng],{radius:8,color:"#fff",fillColor:"#1E8E5A",fillOpacity:1,weight:3}).addTo(lmap).bindTooltip(lt("from"));
  }
  if(state.to){LF.circleMarker([state.to.lat,state.to.lng],{radius:9,color:"#fff",fillColor:"#E6186C",fillOpacity:1,weight:3}).addTo(lmap).bindTooltip(state.to.ko,{permanent:true,direction:"top"});pts.push([state.to.lat,state.to.lng])}
  if(state.loc){LF.circleMarker([state.loc.lat,state.loc.lng],{radius:7,color:"#fff",fillColor:"#2F80ED",fillOpacity:1,weight:3}).addTo(lmap).bindTooltip(t("youHere"));pts.push([state.loc.lat,state.loc.lng])}
  if(pts.length>1) lmap.fitBounds(pts,{padding:[24,24]}); else if(pts.length) lmap.setView(pts[0],15);
}

// ---- route station names for sign check ----
function liveRouteNames(){
  const R=state.routes&&state.routes[state.sel]; const m=new Map(); if(!R) return m;
  R.ko.subPath.forEach((s,i)=>{const ls=R.loc.subPath[i];if(s.trafficType===3)return;
    const a=(s.passStopList&&s.passStopList.stations)||[], b=(ls&&ls.passStopList&&ls.passStopList.stations)||[];
    a.forEach((x,j)=>m.set(x.stationName,b[j]?b[j].stationName:""));});
  return m;
}

// ---- events ----
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return; const ds=b.dataset;
  if(ds.rmode){state.rmode=ds.rmode;saveLive();render();return}
  if(ds.from){state.from={type:ds.from};state.routes=null;saveLive();render();return}
  if(ds.to!==undefined){const p=state.pres.items[+ds.to];state.to={ko:p.ko,addr:p.addr||"",lat:p.lat,lng:p.lng,local:p.local||null};state.pres=null;state.pq="";state.routes=null;state.hotel={name:"",addr:""};saveLive();render();return}
  if(ds.toplace){const p=place(ds.toplace);state.to={ko:p.ko,addr:p.addr||"",lat:p.lat,lng:p.lng,local:p};state.dest=p.route?p.id:state.dest;state.routes=null;state.hotel={name:"",addr:""};saveLive();render();return}
  if("find" in ds){findRoute();return}
  if(ds.sel!==undefined){state.sel=+ds.sel;state.rDone=[];state.live={};saveLive();render();return}
  if(ds.rdone!==undefined){const i=+ds.rdone;state.rDone=state.rDone.includes(i)?state.rDone.filter(x=>x!==i):[...state.rDone,i];render();return}
  if("rreset" in ds){state.rDone=[];render();return}
  if(ds.live){const L0=LIVE_REG[ds.live];if(L0)loadLive(L0);return}
});
document.addEventListener("input",e=>{if(e.target.id==="pq")searchPlaces(e.target.value)});

render();
if(firstRun) langSheet(true);
</script></body></html>
